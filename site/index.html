<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IDERADIO</title>
<meta name="description" content="Our class playlist. New mix every month.">
<meta name="theme-color" content="#bfe6fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.5' stop-color='%23bfe9ff'/%3E%3Cstop offset='1' stop-color='%231f9fe6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23fff' stroke='%23b8c7ce' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400..900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div><div class="rays"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="water"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="intro" id="intro" aria-hidden="true">
  <div class="chrome intro-logo">IDERADIO</div>
  <div class="aero-bar"><div class="aero-fill" id="introFill"></div></div>
  <div class="aero-pct" id="introPct">0%</div>
</div>

<div class="wrap">
  <h1 class="chrome logo">IDERADIO</h1>

  <div class="device" id="onair">
    <div class="screen">
      <div class="ibar">
        <span class="ipod-state" aria-hidden="true">❚❚</span>
        <span class="ibar-title" id="ipodTitle">IDERADIO</span>
        <span class="batt" aria-hidden="true"><i></i></span>
      </div>
      <nav class="itabs" aria-label="Sections">
        <button data-view="mix">This month</button>
        <button data-view="add">Add songs</button>
        <button data-view="archive">Archive</button>
      </nav>
      <div class="np" id="np" hidden>
        <div class="np-art" id="npArt"></div>
        <div class="np-meta">
          <div class="np-t" id="npT"></div>
          <div class="np-s" id="npS"></div>
          <div class="np-prog"><i id="prog"></i></div>
          <div class="np-time"><span id="tNow">0:00</span><span id="tLeft">-0:30</span></div>
        </div>
      </div>
      <main id="view" aria-live="polite"></main>
    </div>

    <div class="wheel-col">
      <div class="wheel" role="group" aria-label="Player controls">
        <button class="w-menu" id="menuBtn" aria-label="Menu">MENU</button>
        <button class="w-prev" id="prevBtn" aria-label="Previous song">⏮</button>
        <button class="w-next" id="nextBtn" aria-label="Next song">⏭</button>
        <button class="w-pp" id="ppBtn" aria-label="Play or pause">▶❚❚</button>
        <button class="w-center" id="playBtn" aria-pressed="false" aria-label="Play the mix"></button>
      </div>
    </div>
  </div>

  <footer><span class="version" id="status">ver. 1.2</span></footer>
</div>

<div id="sheetRoot"></div>
<div id="dockRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
