<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Class Radio</title>
<meta name="description" content="Our class radio. New mix every month.">
<meta name="theme-color" content="#ecebe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2b2f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="smileys/big/music.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Class Radio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=1793577827">
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div><div class="rays"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="water"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="stage">
  <header class="brand">
    <div class="bubble mascot-wrap"><img class="smiley" src="smileys/big/music.png" alt=""></div>
    <div class="brand-txt">
      <h1 class="wordmark chrome">Class Radio</h1>
      <p class="tagline" id="tagline">class radio</p>
    </div>
  </header>

  <div class="ipod-fit" id="fit">
    <div class="ipod" id="ipod">
      <div class="lcd" id="lcd" aria-live="polite"></div>

      <div class="wheel" id="wheel">
        <div class="disc" id="disc"></div>
        <label class="wb wb-menu" id="menuBtn" role="button" tabindex="0" aria-label="Menu, go back"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 350 350" aria-hidden="true"><path id="menuCurve" d="M 30 178 A 145 145 0 0 1 320 178" fill="none"/><text><textPath href="#menuCurve" startOffset="50%" text-anchor="middle">menu</textPath></text></svg>
        </label>
        <label class="wb wb-prev" id="prevBtn" role="button" tabindex="0" aria-label="Previous"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 350 350" aria-hidden="true"><path d="M16 165v20h4v-20zM22 175l12-10v20zM35 175l12-10v20z"/></svg></label>
        <label class="wb wb-next" id="nextBtn" role="button" tabindex="0" aria-label="Next"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 350 350" aria-hidden="true"><path d="M303 165l12 10-12 10zM316 165l12 10-12 10zM330 165v20h4v-20z"/></svg></label>
        <label class="wb wb-pp" id="ppBtn" role="button" tabindex="0" aria-label="Play or pause"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 350 350" aria-hidden="true"><path d="M156 309v20l14-10zM176 309h5v20h-5zM186 309h5v20h-5z"/></svg></label>
        <div class="dividers" aria-hidden="true"></div>
        <div class="zones">
          <label class="zone zone-up" id="upZone" role="button" tabindex="-1" aria-label="Up"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true"></label>
          <label class="zone zone-down" id="downZone" role="button" tabindex="-1" aria-label="Down"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true"></label>
        </div>
        <label class="select" id="selectBtn" role="button" tabindex="0" aria-label="Select"><input type="checkbox" switch class="hsw" tabindex="-1" aria-hidden="true"></label>
      </div>
    </div>
  </div>
</div>

<button class="help-btn" id="helpBtn" aria-label="How the iPod works">?</button>
<a class="credit" href="https://www.kolobok.us" target="_blank" rel="noopener">Smileys © Aiwan · kolobok.us</a>
<div id="obRoot"></div>
<div id="ytHost" class="yt-host" aria-hidden="true"><div id="ytPlayer"></div></div>

<script src="config.js?v=1793577827"></script>
<script src="app.js?v=1793577827"></script>
</body>
</html>
